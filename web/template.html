<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>明日方舟 · 公招词条计算器</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161a21; --panel2:#1d222b; --line:#272e3a;
    --text:#e7ebf2; --muted:#8b94a7; --accent:#4f8cff;
    --r6:#ff8c26; --r5:#ffd23f; --r4:#c084fc; --r3:#5b9bf8; --r1:#9aa3b2;
    --ok:#6fcf8b; --warn:#e0a33e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:18px 14px 60px}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-size:17px;margin:0 0 2px;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .grp{margin-bottom:12px}
  .grp:last-child{margin-bottom:0}
  .grp-title{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:7px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);
    padding:6px 11px;border-radius:999px;font-size:13px;cursor:pointer;user-select:none;
    transition:.12s ease}
  .chip:hover{border-color:#3a4353}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.dis{opacity:.38;cursor:not-allowed;text-decoration:line-through}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .count{font-size:12px;color:var(--muted);margin-left:auto}
  .count b{color:var(--text)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:#3a4353}
  .best{background:linear-gradient(180deg,#1b2130,#161a21);border:1px solid #2f3a4e;
    border-radius:12px;padding:14px;margin-bottom:12px}
  .best-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .best-label{font-size:11px;color:var(--muted);letter-spacing:1px}
  .verdict{font-size:13px;font-weight:600;margin-top:6px}
  .star{font-weight:700;font-size:20px}
  .star small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
  .row{display:flex;gap:10px;padding:9px 2px;border-top:1px solid var(--line);
    align-items:flex-start;font-size:13px}
  .row:first-child{border-top:none}
  .rs{flex:0 0 46px;font-weight:700;font-size:13px}
  .rc{flex:1;min-width:0}
  .tags-inline{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:3px}
  .tg{background:#232936;border:1px solid #2c3444;border-radius:5px;padding:1px 6px;
    font-size:11.5px;color:#c3ccdb}
  .ops{color:var(--muted);font-size:12px;word-break:break-all}
  .ops b{color:#dfe6f2;font-weight:600}
  .lock{display:inline-block;background:#2c3a24;border:1px solid #3f5233;color:#a8d98a;
    font-size:10.5px;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
  .empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}
  .note{color:var(--muted);font-size:11.5px;margin-top:10px;line-height:1.6}
  .note code{background:#20252f;padding:1px 4px;border-radius:3px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <h1>公招词条计算器</h1>
  <div class="sub">勾选识别到的词条（最多 5 个），给出所有组合的保底星级。组合最多 3 个词条，与游戏内限制一致</div>

  <div class="panel">
    <div class="bar" style="margin-bottom:12px">
      <button class="btn" id="demo">示例</button>
      <button class="btn" id="clear">清空</button>
      <span class="count">已选 <b id="n">0</b> / 5</span>
    </div>
    <div id="groups"></div>
  </div>

  <div id="out"></div>

  <div class="note">
    数据：163 名公招池干员 / 31 词条。来源 PRTS 公招池 ∪ 游戏角色数据表，与 MAA 自带数据三源交叉校验，<b>0 处不一致</b>。
    公招池自 2021-09 起未再扩充（PRTS 的 char_obtain 里仍是这批人），所以这份数据不是"过期"，而是池子本身没变。
  </div>
</div>

<script id="recruit-data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('recruit-data').textContent);
const OPS = DATA.operators;
const TAG_KEYS = Object.keys(DATA.tags);

const GROUPS = [
  {t:'稀有度词条', tags:['高级资深干员','资深干员','新手']},
  {t:'位置',      tags:['近战位','远程位']},
  {t:'职业',      tags:['先锋干员','近卫干员','重装干员','狙击干员','术师干员','医疗干员','辅助干员','特种干员']},
  {t:'属性',      tags:['输出','防护','治疗','支援','群攻','生存','减速','削弱','控场','位移','召唤','快速复活','爆发','费用回复','支援机械','元素']},
  {t:'性别（数据未收录，暂不可用）', tags:['女性干员','男性干员'], disabled:true},
];

const MAX = 5;
const sel = new Set();

const RCOLOR = r => ({6:'var(--r6)',5:'var(--r5)',4:'var(--r4)',3:'var(--r3)',2:'#4ade80',1:'var(--r1)'}[r] || 'var(--muted)');
const STAR_CN = r => r===6?'6★':r===5?'5★':r===4?'4★':'3★';

function buildChips(){
  const host = document.getElementById('groups');
  host.innerHTML = '';
  for (const g of GROUPS){
    const wrap = document.createElement('div');
    wrap.className = 'grp';
    wrap.innerHTML = `<div class="grp-title">${g.t}</div>`;
    const box = document.createElement('div');
    box.className = 'chips';
    for (const t of g.tags){
      if (!TAG_KEYS.includes(t)) continue;
      const b = document.createElement('div');
      b.className = 'chip' + (g.disabled ? ' dis' : '');
      b.textContent = t;
      b.dataset.tag = t;
      if (!g.disabled) b.onclick = () => toggle(t);
      box.appendChild(b);
    }
    wrap.appendChild(box);
    host.appendChild(wrap);
  }
  syncChips();
}

function toggle(t){
  if (sel.has(t)) sel.delete(t);
  else {
    if (sel.size >= MAX) return;
    sel.add(t);
  }
  syncChips(); render();
}

function syncChips(){
  document.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('on', sel.has(c.dataset.tag));
  });
  document.getElementById('n').textContent = sel.size;
}

const hasAll = (op, tags) => tags.every(t => op.tags.includes(t));

function subsets(arr){
  const out = [];
  for (let m = 1; m < (1<<arr.length); m++){
    const s = [];
    for (let i = 0; i < arr.length; i++) if (m & (1<<i)) s.push(arr[i]);
    out.push(s);
  }
  return out;
}

function render(){
  const out = document.getElementById('out');
  if (sel.size === 0){
    out.innerHTML = '<div class="panel empty">勾选词条后显示推荐</div>';
    return;
  }
  const chosen = [...sel];
  const results = [];
  for (const sub of subsets(chosen)){
    // 游戏里「职业需求（最多3项）」，4/5 个词条的组合玩家选不出来
    if (sub.length > 3) continue;
    const senior = sub.includes('高级资深干员');
    // 公招的 6★ 只能靠高级资深干员出，不勾就永远不来
    let pool = OPS.filter(op => hasAll(op, sub) && (senior || op.rarity < 6));
    if (!pool.length) continue;
    // 按 9:00:00 招募算：1★/2★ 出不来，抬掉；整池都是低星时只有支援机械保留
    if (Math.min(...pool.map(o=>o.rarity)) < 3) {
      const lifted = pool.filter(o=>o.rarity >= 3);
      if (lifted.length) pool = lifted;
      else if (sub.includes('支援机械')) { /* 刷机器人，保留 1★ */ }
      else continue;
    }
    const floor = Math.min(...pool.map(o=>o.rarity));
    const ceil  = Math.max(...pool.map(o=>o.rarity));
    const avg   = pool.reduce((s,o)=>s+o.rarity,0)/pool.length;
    const floorOps = pool.filter(o=>o.rarity===floor).map(o=>o.name);
    results.push({tags:sub, floor, ceil, avg, floorOps, size:pool.length});
  }
  results.sort((a,b)=> b.floor - a.floor || b.ceil - a.ceil || b.avg - a.avg
                    || a.tags.length - b.tags.length);

  if (!results.length){
    out.innerHTML = '<div class="panel empty">无匹配组合 → 随机 3★</div>';
    return;
  }

  const best = results[0];
  const tagHtml = ts => ts.map(t=>`<span class="tg">${t}</span>`).join('');
  const opsLine = r => r.floorOps.length === 1
    ? `<b>${r.floorOps[0]}</b><span class="lock">锁定</span>`
    : `${r.floorOps.slice(0,8).join('、')}${r.floorOps.length>8?` 等 ${r.floorOps.length} 名`:''}`;
  const meta = r => r.floor < 3
    ? `候选 ${r.size} 人 · 要把时间调短才会出`
    : (r.floor === r.ceil
        ? `候选 ${r.size} 人 · 全是 ${r.floor}★`
        : `候选 ${r.size} 人 · 运气好能出 ${r.ceil}★`);
  const verdict = best.floor >= 5 ? `可以上 · 保底 ${best.floor}★`
    : best.floor === 4 ? '值得上 · 保底 4★'
    : '没有 4★ 保底，建议刷新词条';

  out.innerHTML = `
    <div class="best">
      <div class="best-top">
        <span class="best-label">推荐</span>
        <span class="star" style="color:${RCOLOR(best.floor)}">${best.floor}★</span>
        <span style="color:var(--muted);font-size:12px">保底</span>
      </div>
      <div class="verdict" style="color:${best.floor>=4?'var(--ok)':'var(--warn)'}">${verdict}</div>
      <div class="tags-inline" style="margin-top:8px">${tagHtml(best.tags)}</div>
      <div class="ops" style="margin-top:6px">最低可出：${opsLine(best)}</div>
      <div class="ops" style="margin-top:2px;font-size:11.5px">${meta(best)}</div>
    </div>
    <div class="panel">
      <div class="grp-title">全部组合（${results.length}）</div>
      ${results.map(r=>`
        <div class="row">
          <div class="rs" style="color:${RCOLOR(r.floor)}">${r.floor}★</div>
          <div class="rc">
            <div class="tags-inline">${tagHtml(r.tags)}</div>
            <div class="ops">${opsLine(r)} · ${meta(r)}</div>
          </div>
        </div>`).join('')}
      <div class="note" style="margin-top:10px">保底 = 这组词条至少能出的星级</div>
    </div>`;
}

document.getElementById('clear').onclick = () => { sel.clear(); syncChips(); render(); };
document.getElementById('demo').onclick = () => {
  sel.clear();
  ['高级资深干员','输出','近战位','生存','支援'].forEach(t=>{ if(sel.size<MAX) sel.add(t); });
  syncChips(); render();
};

buildChips(); render();
</script>
</body>
</html>
